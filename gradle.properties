# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
# Build performance.
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache is disabled for now; some AGP tasks are not fully compatible.
org.gradle.configuration-cache=false

# AndroidX.
android.useAndroidX=true
# Generate non-transitive R classes for faster builds and clearer dependencies.
android.nonTransitiveRClass=true

# Kotlin.
kotlin.code.style=official

# The system JDK (25) is too new for the current AGP/Gradle.
# Pin to Android Studio's bundled JBR 21.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
