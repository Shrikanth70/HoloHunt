<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>VYRA - Camera Creation Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "primary-fixed": "#7df4ff",

                        "tertiary": "#f8f5f8",
                        "on-error": "#690005",
                        "on-primary-fixed": "#002022",
                        "surface-tint": "#00dbe9",
                        "primary-container": "#00f0ff",
                        "surface-container-high": "#232b2c",
                        "surface-container-lowest": "#080f10",
                        "on-primary-container": "#006970",
                        "primary": "#dbfcff",
                        "on-background": "#dce4e5"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                    "spacing": {
                        "sm": "8px",
                        "2xl": "48px",
                        "lg": "24px",
                        "unit": "8px",
                        "gutter-mobile": "12px",
                        "margin-mobile": "20px",
                        "xs": "4px",
                        "xl": "32px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],

                        "headline-lg": ["Inter"]

                    "fontSize": {

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]

<style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0A0A0B; /* Deepest layer */
        }
        
        /* Subtle glow for the capture button ring */
        .capture-ring {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }
        
        .capture-ring:active {
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.4);
        }

        .capture-button-inner {
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .capture-button-inner:active {
            transform: scale(0.9);
            background-color: #00F0FF;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
        }

        /* Viewfinder framing */
        .viewfinder-frame {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .frame-tl { top: 20%; left: 5%; border-right: none; border-bottom: none; }
        .frame-tr { top: 20%; right: 5%; border-left: none; border-bottom: none; }
        .frame-bl { bottom: 30%; left: 5%; border-right: none; border-top: none; }
        .frame-br { bottom: 30%; right: 5%; border-left: none; border-top: none; }

        /* Hide scrollbar for mode selector */
        .mode-scroll::-webkit-scrollbar {
            display: none;
        }
        .mode-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased font-body-md relative flex flex-col items-center justify-between">
<!-- Viewfinder Background (Simulated Camera Feed) -->
<div class="absolute inset-0 z-0 bg-surface-dim" data-alt="A high-tech, cinematic augmented reality view through a digital camera lens. The scene shows a modern, minimalist urban landscape with subtle neon lighting and architectural depth. The overall aesthetic is dark, moody, and futuristic, dominated by deep charcoal blacks and subtle electric cyan highlights. The atmosphere feels immersive and professional, like a high-end creative tool capturing reality." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAB3ZSdjAjzsWa-2o8zrZ3vQMScUv5lb52ZfVPwgV5dCqpt07WTojywPA0CWKb0vDVIWETNeGFE0hQ7pycvGv9BusbYtl7d4W8YzplUeeUvku6BMbVtBQqYBMoombBgkqS6YBqdsdVDA3JMjbOEQ2Y2YMzSFn17WflUCm3biDcoi_mtLAC8StkyBWouNQROmgCbFCA8zv5A6PfhosyrfEpC7g-NMsCUIWHeddB_P0HArXGfQvMy_ZUHkw')">
<!-- Overlay to create the OLED-optimized immersive feel -->
<div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/90"></div>
</div>
<!-- Viewfinder Framing Guides -->
<div class="viewfinder-frame frame-tl z-10 pointer-events-none"></div>
<div class="viewfinder-frame frame-tr z-10 pointer-events-none"></div>
<div class="viewfinder-frame frame-bl z-10 pointer-events-none"></div>
<div class="viewfinder-frame frame-br z-10 pointer-events-none"></div>
<!-- Top App Bar Area (Minimal Controls) -->
<div class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-gradient-to-b from-black/60 to-transparent">
<button class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-10 h-10 rounded-full bg-surface/20 backdrop-blur-xl border border-white/10 active:scale-95">
<span class="material-symbols-outlined" data-icon="close" data-weight="regular">close</span>
</button>
<div class="flex space-x-sm">
<button class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-10 h-10 rounded-full bg-surface/20 backdrop-blur-xl border border-white/10 active:scale-95">
<span class="material-symbols-outlined" data-icon="flash_off" data-weight="regular">flash_off</span>
</button>
<button class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-10 h-10 rounded-full bg-surface/20 backdrop-blur-xl border border-white/10 active:scale-95">
<span class="material-symbols-outlined" data-icon="more_vert" data-weight="regular">more_vert</span>
</button>
</div>
</div>
<!-- Bottom Controls Area -->
<div class="w-full z-50 flex flex-col items-center pb-xl pt-lg bg-gradient-to-t from-black via-black/80 to-transparent">
<!-- Mode Selector -->
<div class="w-full overflow-x-auto mode-scroll mb-lg relative">
<div class="flex justify-center items-center space-x-lg px-margin-mobile min-w-max mx-auto">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors uppercase tracking-widest">
                    TIMELAPSE
                </button>
<button class="font-label-md text-label-md text-primary-container drop-shadow-[0_0_8px_rgba(0,240,255,0.5)] transition-colors uppercase tracking-widest relative">
                    PHOTO
                    <!-- Active Indicator Dot -->
<span class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-1 h-1 bg-primary-container rounded-full"></span>
</button>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors uppercase tracking-widest">
                    VIDEO
                </button>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors uppercase tracking-widest">
                    PRO
                </button>
</div>
<!-- Fade masks for scroll area -->
<div class="absolute inset-y-0 left-0 w-12 bg-gradient-to-r from-black to-transparent pointer-events-none"></div>
<div class="absolute inset-y-0 right-0 w-12 bg-gradient-to-l from-black to-transparent pointer-events-none"></div>
</div>
<!-- Primary Camera Actions -->
<div class="w-full flex justify-between items-center px-2xl">
<!-- Gallery / Media Picker -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-lg overflow-hidden border border-white/10 bg-surface/20 backdrop-blur-md hover:border-primary-container transition-colors active:scale-95 group">
<div class="w-full h-full bg-surface-container flex items-center justify-center" data-alt="A small thumbnail preview of a previously captured photo, showing an abstract geometric shape with cyan highlights on a dark background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDJO5L02fK2vMJ38woiXmBNu6H955Y0bFyD1prRxyBFG15XGv_G36XzYy8bkS7JyS2WZU6KEp-kEGblRNq4zNPB8RPL_W6JsbfOMTn-uacshrG-XO3sMDEddtx_nUV7ocBoVGza8rOtyzXZNvnV8kNF1qC3JD4r_vZtwbzMbJOfqkW8Bawg5xZFoHFiKm4H00Vsy0Wa7dnOGttpx1R4Bje8ziMvoG7bzC8Kr-yvusubfBGnoC8i4hnGWg'); background-size: cover; background-position: center;">
<!-- Overlay if no thumbnail -->
</div>
</button>
<!-- Prominent Capture Button -->
<button class="relative flex items-center justify-center w-[72px] h-[72px] rounded-full capture-ring group focus:outline-none">
<div class="capture-button-inner w-[56px] h-[56px] rounded-full bg-white group-hover:bg-primary transition-colors"></div>
</button>
<!-- AR / Flip Controls -->
<div class="flex space-x-sm">
<button class="flex items-center justify-center w-12 h-12 rounded-full bg-surface/20 backdrop-blur-xl border border-white/10 text-on-surface hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="view_in_ar" data-weight="regular">view_in_ar</span>
</button>
<button class="flex items-center justify-center w-12 h-12 rounded-full bg-surface/20 backdrop-blur-xl border border-white/10 text-on-surface hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="flip_camera_ios" data-weight="regular">flip_camera_ios</span>
</button>
</div>
</div>
<!-- Zoom Level / Tool Chips (Minimal) -->
<div class="flex justify-center items-center space-x-md mt-lg">
<button class="w-8 h-8 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center font-label-sm text-label-sm text-on-surface hover:border-primary-container transition-colors">
                .5
            </button>
<button class="w-8 h-8 rounded-full bg-black/60 backdrop-blur-md border border-primary-container flex items-center justify-center font-label-sm text-label-sm text-primary-container drop-shadow-[0_0_8px_rgba(0,240,255,0.3)] transition-colors">
                1x
            </button>
<button class="w-8 h-8 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center font-label-sm text-label-sm text-on-surface hover:border-primary-container transition-colors">
                2
            </button>
</div>
</div>
</body></html>
