<!DOCTYPE html>

<style>
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling for immersive editor */
            overscroll-behavior-y: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* Hide scrollbar for timeline */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Transform Bounding Box */
        .transform-box {
            position: absolute;
            border: 1px solid theme('colors.primary-container');
            pointer-events: none;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .transform-corner {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: theme('colors.primary-container');
            border: 1px solid theme('colors.background');
            pointer-events: auto;
        }
        .tl { top: -4px; left: -4px; }
        .tr { top: -4px; right: -4px; }
        .bl { bottom: -4px; left: -4px; }
        .br { bottom: -4px; right: -4px; }

    </style>
</head>
<body class="h-screen w-screen flex flex-col antialiased selection:bg-primary-container selection:text-background relative">
<!-- Center: Video Preview Area (Full Bleed Background) -->
<div class="absolute inset-0 z-0 flex items-center justify-center bg-black overflow-hidden">
<!-- Background Video/Image Placeholder -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center opacity-80" data-alt="A cinematic, highly detailed wide shot of a futuristic cyberpunk cityscape at night, illuminated by neon lights and glowing billboards. The scene has a dark, moody atmosphere with a high contrast between deep shadows and bright, vibrant cyan and magenta accents. The style is hyper-realistic and immersive." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAEkqQgwcQzk3aWAlyk0B1ZxPoKzrVVCPznor6_dR4izT9GvOKBG5TpEt8N_8DpaLtkJmm44E13zHKjdfc99Ydw076_ZxOlp3biX8M69Xnps0pFxlyqTzlkRt-jL0I2uI3YoJ530Ga4XzkqGRUYrMq40sKsT3J3rsGmizy-aJV1URMESlUm1XYQZ9K4EebOoN4YuC7ol5MrHmji-SD-SaVxyV_d_gPrGSDuwV7RiigEOXSRELfEm7yhHQ')"></div>
<!-- Subject Overlay with Bounding Box -->
<div class="relative w-64 h-64 z-10">
<div class="w-full h-full bg-contain bg-no-repeat bg-center" data-alt="A highly detailed, futuristic mechanical hound companion, rendered in a dark chrome aesthetic with electric cyan glowing accents along its joints and eyes. The mechanical subject stands alert against the dark background, looking sleek, advanced, and slightly menacing. The lighting emphasizes its metallic textures and sharp geometric angles." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAy6wIDQdQjUyUftiZcF2tuI_6fWcuqAAFxW8T5WEDbWijTnJNvdq-TA3qUdEDI0e9ADESlr45kchPnup05kUCelJ9nZJkK9DyArEvNLSoOEaV4pcdpgEO2_tzooTViUw9kSo1_MwuPmzBOSqIr6EY9A6XjRbClv0AHWqlYvPl6tfAoZu5WO-4IbsdvfXJX5YZ79eRoH0I4sf-QyYm0KHbFzvHwJ9BwfZow23iYmxa3kADsEtmw93Tw0Q')"></div>
<!-- Bounding Box -->
<div class="transform-box inset-0">
<div class="transform-corner tl cursor-nwse-resize"></div>
<div class="transform-corner tr cursor-nesw-resize"></div>
<div class="transform-corner bl cursor-nesw-resize"></div>
<div class="transform-corner br cursor-nwse-resize"></div>
</div>
</div>
</div>
<!-- Top AppBar (Transparent Overlay) -->
<header class="fixed top-0 w-full z-50 bg-gradient-to-b from-black/80 to-transparent pt-safe-top">
<div class="flex justify-between items-center px-margin-mobile h-16">
<!-- Back & Undo/Redo -->
<div class="flex items-center gap-md">
<button class="text-on-surface hover:opacity-80 active:opacity-70 transition-opacity p-sm rounded-full bg-surface-dim/40 backdrop-blur-md border border-white/10">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<div class="flex items-center gap-xs bg-surface-dim/40 backdrop-blur-md border border-white/10 rounded-full px-sm py-xs">
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-xs">
<span class="material-symbols-outlined text-[20px]">undo</span>
</button>
<div class="w-px h-4 bg-white/10"></div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-xs">
<span class="material-symbols-outlined text-[20px]">redo</span>
</button>
</div>
</div>
<!-- Export Action -->
<button class="bg-primary-container text-background font-label-md text-label-md px-lg py-sm rounded-full shadow-[0_0_12px_rgba(0,240,255,0.4)] hover:opacity-90 active:scale-95 transition-all flex items-center gap-xs">
<span>Export</span>
<span class="material-symbols-outlined text-[18px]">upload</span>
</button>
</div>
</header>
<!-- Spacer to push bottom section down -->
<div class="flex-grow"></div>
<!-- Bottom Section (Timeline, Playback, Tools) -->
<div class="relative z-20 bg-surface/90 backdrop-blur-2xl border-t border-white/10 flex flex-col rounded-t-[24px] pb-safe-bottom">
<!-- Timeline Section -->
<div class="relative h-48 border-b border-white/10 flex flex-col justify-end pb-sm pt-md px-margin-mobile overflow-hidden">
<!-- Playhead -->
<div class="absolute top-0 bottom-0 left-1/2 w-px bg-primary-container z-30 shadow-[0_0_8px_rgba(0,240,255,0.8)] pointer-events-none">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-3 h-3 bg-primary-container rounded-full shadow-[0_0_8px_rgba(0,240,255,0.8)]"></div>
</div>
<!-- Tracks Container (Scrollable) -->
<div class="flex flex-col gap-sm overflow-x-auto no-scrollbar relative w-full h-full pb-md">
<!-- Track 1: Subject (Mecha Hound) -->
<div class="flex items-center h-12 w-[200%] absolute top-8 left-[-10%]">
<!-- Layer Icon/Label (Fixed Left conceptually, simplified for mock) -->
<div class="sticky left-0 bg-surface-container-high/90 z-20 h-full flex items-center px-sm border-r border-white/10 min-w-[48px] rounded-l-md">
<span class="material-symbols-outlined text-primary-container text-[20px]">cruelty_free</span>
</div>
<!-- Clip -->
<div class="h-full bg-primary-container/20 border border-primary-container/50 rounded-r-md rounded-l-none flex-grow relative overflow-hidden backdrop-blur-sm">
<!-- Thumbnail pattern placeholder -->

<div class="absolute left-2 top-1/2 -translate-y-1/2 font-label-sm text-label-sm text-primary-container drop-shadow-md">Mecha_Hound_01</div>
</div>
</div>
<!-- Track 2: Base Video -->
<div class="flex items-center h-12 w-[200%] absolute top-24 left-0">

<span class="material-symbols-outlined text-on-surface-variant text-[20px]">movie</span>
</div>

<div class="flex h-full w-full gap-px px-px py-px opacity-50">

</div>
</div>
<!-- Time Ruler -->
<div class="absolute top-0 left-0 w-full h-6 border-b border-white/5 bg-surface-container-low/50 flex justify-between px-margin-mobile font-label-sm text-[10px] text-on-surface-variant/50 items-center">

<span>00:10</span>
<span>00:15</span>
</div>
</div>
<!-- Playback Controls -->
<div class="flex justify-between items-center px-margin-mobile py-sm border-b border-white/5">

<div class="flex items-center gap-lg">
<button class="text-on-surface hover:text-primary-container transition-colors p-sm">
<span class="material-symbols-outlined text-[24px]">skip_previous</span>
</button>
<button class="text-background bg-primary-container rounded-full p-sm hover:scale-105 active:scale-95 transition-all shadow-[0_0_12px_rgba(0,240,255,0.4)]">
<span class="material-symbols-outlined filled text-[32px]">play_arrow</span>
</button>

<span class="material-symbols-outlined text-[24px]">skip_next</span>
</button>
</div>

</div>
<!-- Tool Bar -->
<div class="flex justify-between items-center px-margin-mobile py-md overflow-x-auto no-scrollbar gap-lg">
<button class="flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors min-w-[56px] group">
<div class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center bg-surface-container group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">add</span>

<button class="flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors min-w-[56px] group">

</div>

<button class="flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors min-w-[56px] group">

<span class="material-symbols-outlined">auto_awesome</span>
</div>
<span class="font-label-sm text-label-sm">Effects</span>
</button>
<button class="flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors min-w-[56px] group">
<div class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center bg-surface-container group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">graphic_eq</span>

<span class="font-label-sm text-label-sm">Audio</span>
</button>
</div>
</div>
