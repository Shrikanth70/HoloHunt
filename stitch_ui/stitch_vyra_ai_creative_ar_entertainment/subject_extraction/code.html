<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .checkerboard-bg {
            background-color: #0d1515;
            background-image: 
                linear-gradient(45deg, #151d1e 25%, transparent 25%, transparent 75%, #151d1e 75%, #151d1e),
                linear-gradient(45deg, #151d1e 25%, transparent 25%, transparent 75%, #151d1e 75%, #151d1e);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .shimmer-text {
            background: linear-gradient(90deg, #b9cacb 0%, #ffffff 50%, #b9cacb 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        .pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); border-color: rgba(0, 240, 255, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 240, 255, 0.6); border-color: rgba(0, 240, 255, 0.8); }
            100% { box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); border-color: rgba(0, 240, 255, 0.3); }
        }
    </style>

<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-md select-none">
<!-- Top App Bar -->
<header class="bg-transparent text-primary fixed top-0 w-full z-50 bg-gradient-to-b from-black/80 to-transparent flex justify-between items-center px-margin-mobile h-16 pt-safe-top">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary hover:opacity-80 active:opacity-70 transition-opacity cursor-pointer text-2xl mr-4" data-icon="close">close</span>

</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary hover:opacity-80 active:opacity-70 transition-opacity cursor-pointer" data-icon="tune">tune</span>
</div>

<!-- Main Viewport -->

<!-- Base Image (Faded/Extracting) -->

</div>

<img class="h-[70vh] object-contain rounded-lg pulse-glow border-2 border-primary-container border-opacity-50" data-alt="The exact same cinematic high-fashion portrait of a model from the previous prompt, but strictly isolated on a completely transparent background. The edges of the subject are perfectly clean and sharp, demonstrating advanced AI extraction capabilities. Deep blacks and professional lighting remain intact, perfectly fitting the futuristic dark chrome aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD02hYot81L9mHP7IQqEdFZhb8axwPeLTjZc1FOsRWiLHB8ZQ_AcNvDqEnj0JuEfHstaWUg--jUMhiu_wIlYmGa2-F3Hk6cV5XVyhigT7m2iYmPkf-_V_fjt727PcQTeORP_azHGmbziSZdZ7MWdvaskPdnz-VKjmYBZbvGvQR_H5udoxiBxxYW45U3cv9qH3ZVbagQfcaPdW8-0yGxJfLgSUsXPeFxrupEAjHvGYL7ecDnxchuzEyP2Q"/>

<button class="flex-[2] py-4 px-6 rounded-lg bg-primary-container text-on-primary-fixed font-headline-md text-body-md font-bold hover:bg-primary-fixed active:scale-95 transition-all text-center shadow-[0_0_15px_rgba(0,240,255,0.3)]">
                    Use Subject
                </button>
</div>

</div>
<script>
        // Simple script to simulate extraction progress
        document.addEventListener('DOMContentLoaded', () => {
            const statusIndicator = document.querySelector('.shimmer-text').parentElement.parentElement;
            const statusText = document.querySelector('.shimmer-text');
            const spinner = document.querySelector('.animate-spin');
            const extractedSubject = document.getElementById('extracted-subject');
            const baseImage = document.getElementById('base-image-container');

            setTimeout(() => {
                // Simulate completion
                statusText.textContent = 'Subject extracted';
                statusText.classList.remove('shimmer-text');
                statusText.classList.add('text-primary-container');
                spinner.style.display = 'none';
                
                const checkIcon = document.createElement('span');
                checkIcon.className = 'material-symbols-outlined text-primary-container';
                checkIcon.textContent = 'check_circle';
                statusIndicator.querySelector('.flex').prepend(checkIcon);

                extractedSubject.classList.add('scale-105');
                baseImage.classList.add('opacity-10');

                setTimeout(() => {
                    statusIndicator.style.opacity = '0';
                    statusIndicator.style.transition = 'opacity 0.5s ease-out';
                }, 1500);

            }, 3500);
        });
    </script>
