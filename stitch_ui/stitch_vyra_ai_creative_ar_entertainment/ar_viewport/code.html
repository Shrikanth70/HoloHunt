<style>
        body {
            overscroll-behavior-y: none;
        }
        .ar-grid {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) scale(2);
            transform-origin: bottom center;
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col font-body-md relative">
<!-- AR Camera View (Simulated Background) -->

</div>

<button class="w-12 h-12 rounded-full bg-surface-container/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">close</span>
</button>
<div class="px-md py-sm rounded-full bg-surface-container/50 backdrop-blur-md border border-white/10 flex items-center gap-sm">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface tracking-wider">AR ACTIVE</span>
</div>
<button class="w-12 h-12 rounded-full bg-surface-container/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">view_in_ar</span>
</button>
</div>
<!-- Bottom Controls Layer -->
<div class="absolute bottom-0 w-full z-10 pb-12 pt-xl bg-gradient-to-t from-black/80 via-black/40 to-transparent flex flex-col items-center">

<div class="snap-center shrink-0 w-20 h-20 rounded-xl bg-surface-container/50 backdrop-blur-sm border border-white/10 overflow-hidden opacity-70 hover:opacity-100 transition-opacity">

<div class="snap-center shrink-0 w-20 h-20 rounded-xl bg-surface-container/50 backdrop-blur-sm border border-white/10 overflow-hidden opacity-70 hover:opacity-100 transition-opacity flex items-center justify-center">

</div>
</div>
<!-- Main Action Bar -->
<div class="flex items-center justify-center gap-xl px-margin-mobile w-full max-w-sm">

</div>
<button class="w-12 h-12 flex items-center justify-center text-on-surface hover:text-primary transition-colors">

<style>
        .no-scrollbar::-webkit-scrollbar {
