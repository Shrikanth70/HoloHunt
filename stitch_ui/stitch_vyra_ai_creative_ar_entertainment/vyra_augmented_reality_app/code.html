<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle shimmer animation for background */
        @keyframes subtle-shimmer {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .ambient-gradient {
            background: radial-gradient(circle at center, #192122 0%, #080f10 100%);
            background-size: 200% 200%;
            animation: subtle-shimmer 15s ease infinite;
        }
        
        /* Entrance animation for text */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        .fade-in-up-delay {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background h-screen w-screen overflow-hidden ambient-gradient flex flex-col justify-center items-center">
<!-- Canvas Overlay for texture -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<!-- Main Content -->
<main class="z-10 flex flex-col items-center justify-center text-center px-margin-mobile">
<!-- Brand Name -->
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter fade-in-up drop-shadow-[0_0_24px_rgba(0,240,255,0.15)]">
            VYRA
        </h1>
<!-- Tagline -->
<p class="font-label-md text-label-md text-on-surface-variant mt-sm uppercase tracking-widest fade-in-up-delay">
            Make reality yours.
        </p>
</main>
